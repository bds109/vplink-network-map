<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VPL Germany Network Map</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html,body{
height:100%;
margin:0;
}

#map{
width:100%;
height:100vh;
}

html,body{
height:100%;
margin:0;
}

#map{
width:100%;
height:100vh;
}

.store-dot{
width:16px;
height:16px;
background:#007BFF;
border:3px solid #ffffff;
border-radius:50%;
box-shadow:0 0 6px rgba(0,0,0,0.3);
}
  
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>

var map = L.map('map').setView([51.1657,10.4515],6);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);
  


/* CSV读取 */

var markerCluster = L.markerClusterGroup();

var stateCount = {};

function getStateColor(count){

    if(count >= 20){
        return '#EC4899';
    }

    if(count >= 10){
        return '#8B5CF6';
    }

    if(count >= 5){
        return '#3B82F6';
    }

    if(count >= 1){
        return '#14B8A6';
    }

    return 'transparent';
}

var stateNameMap = {
'柏林':'Berlin',
'勃兰登堡州':'Brandenburg',
'北威州':'Nordrhein-Westfalen',
'巴符州':'Baden-Württemberg',
'黑森州':'Hessen',
'莱法州':'Rheinland-Pfalz',
'梅前州':'Mecklenburg-Vorpommern',
'汉堡州':'Hamburg',
'汉堡':'Hamburg',
'巴伐利亚州':'Bayern',
'石荷州':'Schleswig-Holstein',
'下萨克森州':'Niedersachsen',
'萨安州':'Sachsen-Anhalt'
};

var storeIcon = L.divIcon({
    className: 'store-marker',
    html: '<div class="store-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
});

Papa.parse('VPL门店地图信息_0606.csv', {

    download: true,
    header: true,

    complete: function(results) {

        console.log(results.data);

        results.data.forEach(function(store) {

    var germanState = stateNameMap[store.State];

    if(germanState){

        if(!stateCount[germanState]){
            stateCount[germanState] = 0;
        }

        stateCount[germanState]++;

    }

    if (!store.Latitude || !store.Longitude) {
        return;
    }

var marker = L.marker(
    [
        parseFloat(store.Latitude),
        parseFloat(store.Longitude)
    ],
    {
        icon: storeIcon
    }
);

            marker.bindPopup(
                '<b>' + store.StoreName + '</b><br>' +
                store.Address + '<br>' +
                store.StoreType
            );

            markerCluster.addLayer(marker);

        });

        map.addLayer(markerCluster);

fetch('2_hoch.geo_1.4M.json')
.then(response => response.json())
.then(data => {

L.geoJSON(data, {

style:function(feature){

    var stateName = feature.properties.name;

    if(stateCount[stateName] > 0){

        var count = stateCount[stateName];

        return{
            color:'#94A3B8',
            weight:2,
            fillColor:getStateColor(count),
            fillOpacity:0.28
        };

    }

    return{
        color:'#94A3B8',
        weight:2,
        fillColor:'transparent',
        fillOpacity:0
    };

}

}).addTo(map);

});

    }

});

</script>

</body>
</html>
