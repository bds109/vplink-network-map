<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VPL Germany Network Map</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,body{
height:100%;
margin:0;
}

#map{
width:100%;
height:100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([51.1657,10.4515],6);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);
  
fetch('2_hoch.geo_1.4M.json')
.then(response => response.json())
.then(data => {

const activeStates = [
'Berlin',
'Brandenburg',
'Nordrhein-Westfalen',
'Baden-Württemberg',
'Hessen',
'Rheinland-Pfalz',
'Mecklenburg-Vorpommern',
'Hamburg'
];

L.geoJSON(data,{

style:function(feature){

if(activeStates.includes(feature.properties.name)){

return{
color:'#2563eb',
weight:2,
fillColor:'#3b82f6',
fillOpacity:0.25
};

}

return{
color:'#cccccc',
weight:1,
fillColor:'#ffffff',
fillOpacity:0.05
};

}

}).addTo(map);

});
</script>

</body>
</html>
